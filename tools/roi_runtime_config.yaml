protocol:
  host: 127.0.0.1
  port: 5057
  connect_timeout_sec: 30.0
  reset_on_start: true
  step_interval_sec: 0.0
  max_steps: 300
  action: [0.0, 0.0, 0.0, 0.0]

detector:
  model_path: ../../_model_archive/roi_smoke_detector.onnx
  input_width: 576
  input_height: 576
  confidence_threshold: 0.35
  nms_iou_threshold: 0.5
  output_tensor_name: ""
  class_labels:
    - bucket
    - excavator_arm
    - truck
    - container
    - dig_area
  max_expected_joint_velocity: 1.5

output:
  preview: true
  preview_window_name: ROI Overlay Runtime
  preview_scale: 1.0
  encode_video: true
  output_path: ../../ExperimentLogs/roi_overlay_runtime/roi_overlay_runtime.h264
  csv_log_path: ../../ExperimentLogs/roi_overlay_runtime/roi_overlay_runtime.csv
  fps_override: 0.0
  h264_crf: 18
  h264_preset: veryfast
